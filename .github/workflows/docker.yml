name: Build and push Docker image

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Pelna historia z tagami - git describe bez niej zwraca "dev"
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Ustal wersje z najnowszego tagu
        run: |
          # Obraz :latest jest budowany z main, wiec wersja opisuje polozenie
          # wzgledem najblizszego tagu. BEZ --abbrev=0: samo zaokraglenie w dol
          # do tagu sprawialo, ze kazdy build z main podawal sie za wydanie
          # (np. "1.1.0"), wiec dwie rozne binarki raportowaly ta sama wersje.
          # Kolumna agent_version istnieje po to, by support wiedzial, kto na
          # czym siedzi - zaokraglona wartosc to przekreslala.
          #
          # Na tagu:      1.1.0
          # Poza tagiem:  1.1.0-1-g9bd468e  (1 commit za tagiem, ten skrot)
          # Bez tagow:    dev
          #
          # Endpoint heartbeatu przepuszcza to bez zmian: dopuszcza myslniki
          # i do 32 znakow.
          V=$(git describe --tags 2>/dev/null | sed 's/^v//' || echo dev)
          echo "AGENT_VERSION=$V" >> "$GITHUB_ENV"
          echo "Buduje obraz jako wersja: $V"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ env.AGENT_VERSION }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/smarthomeentry-agent:latest
            ghcr.io/${{ github.repository_owner }}/smarthomeentry-agent:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/smarthomeentry-agent:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/smarthomeentry-agent:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

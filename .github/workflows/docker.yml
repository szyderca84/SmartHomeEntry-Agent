name: Build and push Docker image

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Pelna historia z tagami - git describe bez niej zwraca "dev"
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Ustal wersje z najnowszego tagu
        run: |
          # Obraz :latest jest budowany z main, wiec wersja to najblizszy tag
          # poprzedzajacy ten commit. Bez tagu w historii zostaje "dev".
          V=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo dev)
          echo "AGENT_VERSION=$V" >> "$GITHUB_ENV"
          echo "Buduje obraz jako wersja: $V"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ env.AGENT_VERSION }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/smarthomeentry-agent:latest
            ghcr.io/${{ github.repository_owner }}/smarthomeentry-agent:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/smarthomeentry-agent:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/smarthomeentry-agent:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
